name: Sync Blog Posts Index

on:
  push:
    paths:
      - 'content/posts/**.md'
      - 'content/settings.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate posts.json from markdown files
        run: |
          python3 - << 'EOF'
          import os, json, re

          posts_dir = "content/posts"
          posts = []

          for filename in os.listdir(posts_dir):
              if filename.endswith(".md"):
                  filepath = os.path.join(posts_dir, filename)
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()

                  match = re.match(r"^---\s*\n(.*?)\n---\s*\n", content, re.DOTALL)
                  if match:
                      meta_str = match.group(1)
                      meta = {}
                      for line in meta_str.split("\n"):
                          if ":" in line:
                              k, v = line.split(":", 1)
                              k = k.strip()
                              v = v.strip().strip('"').strip("'")
                              if k == "tags":
                                  try:
                                      meta[k] = json.loads(v.replace("'", '"'))
                                  except:
                                      meta[k] = [t.strip().strip('"').strip("'") for t in v.strip("[]").split(",") if t.strip()]
                              else:
                                  meta[k] = v

                      slug = meta.get("slug") or filename.replace(".md", "")
                      posts.append({
                          "title": meta.get("title", filename),
                          "slug": slug,
                          "date": meta.get("date", "2026"),
                          "category": meta.get("category", "Mühendislik"),
                          "image": meta.get("image", "assets/images/cad-drafting.jpg"),
                          "description": meta.get("description", ""),
                          "tags": meta.get("tags", [])
                      })

          # Tarihe göre yeniden eskiye sırala
          posts.sort(key=lambda x: str(x.get("date", "")), reverse=True)

          with open(os.path.join(posts_dir, "posts.json"), "w", encoding="utf-8") as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)

          print(f"Successfully generated posts.json with {len(posts)} posts.")
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/posts.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): sync posts.json from markdown files"
            git push
          fi
